# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX package structure to make it clear which packages are androidx
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables persistent caching for kapt/ksp
ksp.incremental=true
