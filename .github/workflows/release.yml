name: Release

# On main: builds the app, signed with the same key Android Studio uses on Tim's PC (so it installs
# over the app already on his devices), and publishes the sync server image with that build inside
# at /app. Each device then offers the update itself (Settings → App updates).
#
# The key comes from the DEBUG_KEYSTORE_B64 secret: Tim's C:\Users\timot\.android\debug.keystore in
# base64. Without it the image is still published, just without an app build.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PB_VERSION: "0.40.5"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app with the signing key
        id: apk
        shell: bash
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No DEBUG_KEYSTORE_B64 secret: publishing the server without an app build."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          apk="quartz-notes-${name}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "server/app-release/${apk}"
          size=$(stat -c %s "server/app-release/${apk}")
          sum=$(sha256sum "server/app-release/${apk}" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s","size":%s,"sha256":"%s"}\n' "$code" "$name" "$apk" "$size" "$sum" > server/app-release/version.json
          cat server/app-release/version.json
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "### App ${name} (${code}) is in this server image" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/quartz-sync" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          build-args: PB_VERSION=${{ env.PB_VERSION }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
