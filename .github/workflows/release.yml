name: Release

# On main: builds the release app, signed with Tim's own key (the one he signs with in Android
# Studio, E:\Dev\Notes.jks) so it installs over the app already on his devices, and publishes the
# sync server image with that build inside at /app. Each device then offers the update itself
# (Settings → App updates).
#
# The key comes from repository secrets: NOTES_KEYSTORE_B64 (the .jks file in base64),
# NOTES_KEYSTORE_PASSWORD, NOTES_KEY_ALIAS and NOTES_KEY_PASSWORD. Without them the image is still
# published, just without an app build.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PB_VERSION: "0.40.5"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app with the signing key
        id: apk
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NOTES_KEYSTORE_B64 }}
          QUARTZ_KEYSTORE_PASSWORD: ${{ secrets.NOTES_KEYSTORE_PASSWORD }}
          QUARTZ_KEY_ALIAS: ${{ secrets.NOTES_KEY_ALIAS }}
          QUARTZ_KEY_PASSWORD: ${{ secrets.NOTES_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$QUARTZ_KEYSTORE_PASSWORD" ] || [ -z "$QUARTZ_KEY_ALIAS" ]; then
            echo "::warning::The signing secrets aren't set: publishing the server without an app build."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A key with no separate key password uses the store password.
          export QUARTZ_KEY_PASSWORD="${QUARTZ_KEY_PASSWORD:-$QUARTZ_KEYSTORE_PASSWORD}"
          export QUARTZ_KEYSTORE="$RUNNER_TEMP/notes.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$QUARTZ_KEYSTORE"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          rm -f "$QUARTZ_KEYSTORE"
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          apk="quartz-notes-${name}.apk"
          cp app/build/outputs/apk/release/app-release.apk "server/app-release/${apk}"
          size=$(stat -c %s "server/app-release/${apk}")
          sum=$(sha256sum "server/app-release/${apk}" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s","size":%s,"sha256":"%s"}\n' "$code" "$name" "$apk" "$size" "$sum" > server/app-release/version.json
          cat server/app-release/version.json
          # Which key signed it, to compare with the app on the devices if an install is refused.
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "server/app-release/${apk}" | grep -i "SHA-256" | head -1 || true
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "### App ${name} (${code}) is in this server image" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/quartz-sync" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          build-args: PB_VERSION=${{ env.PB_VERSION }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
