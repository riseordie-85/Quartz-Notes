name: Android build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations so they're visible without the full log.
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: quartz-notes-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
