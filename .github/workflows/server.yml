name: Sync server

# Checks the sync server's schema and rules against a real PocketBase, and on main publishes the
# server image (ghcr.io/<owner>/quartz-sync) that the NUC runs.
on:
  push:
    branches: [ "**" ]
    paths: [ "server/**", ".github/workflows/server.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PB_VERSION: "0.40.5"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start PocketBase with the repo's schema and rules
        run: |
          wget -q "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip" -O pb.zip
          unzip -q pb.zip pocketbase
          ./pocketbase superuser upsert admin@test.local adminpass123 --dir=pb_data --migrationsDir=server/pb_migrations
          ./pocketbase serve --http=127.0.0.1:8090 --dir=pb_data --migrationsDir=server/pb_migrations --hooksDir=server/pb_hooks --publicDir=server/pb_public > pb.log 2>&1 &
          for i in $(seq 1 50); do curl -s http://127.0.0.1:8090/api/health >/dev/null && break; sleep 0.2; done
      - name: Server checks
        run: python3 server/tests/smoke_test.py http://127.0.0.1:8090 admin@test.local adminpass123
      - name: Server log
        if: failure()
        run: tail -50 pb.log

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/quartz-sync" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          build-args: PB_VERSION=${{ env.PB_VERSION }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
