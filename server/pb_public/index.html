<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartz Notes</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --ink: #1d1d22; --muted: #6b6b75; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16161a; --ink: #ededf0; --muted: #9a9aa5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Quartz Notes sync server</h1>
  <p>The server is running. The web app is coming soon.</p>
</main>
</body>
</html>
